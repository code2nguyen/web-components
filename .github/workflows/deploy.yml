name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Set up GitHub Actions caching for Wireit.
      - uses: google/wireit@setup-github-actions-caching/v1

      # `npm install`, not `npm ci`, on purpose.
      #
      # The toolchain (rolldown, esbuild, lightningcss, sharp, @astrojs/compiler, @parcel/watcher, …) ships its
      # native binaries as platform-gated optionalDependencies. npm resolves those for the host platform only, so a
      # lockfile written on macOS records `@rolldown/binding-darwin-arm64` and nothing for Linux — and `npm ci`
      # installs strictly from the lockfile. The install then succeeds and the *build* dies with
      # `Cannot find module '@rolldown/binding-linux-x64-gnu'`. `--os`/`--cpu` overrides do not change what gets
      # written to the lockfile, so this cannot be fixed by regenerating it on a Mac.
      #
      # `npm install` still takes its versions from the lockfile; it only additionally fetches the optional
      # binaries this platform needs. It rewrites the lockfile in the runner, which is discarded.
      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
        
      - name: Build UI app
        shell: "bash"
        run: npm run ui:build

      - name: Build tools (MCP registry, skill cheatsheet)
        run: npm run build:tools

      - name: Smoke test the MCP server
        run: npm run mcp:smoke

      - name: Generated files are up to date
        run: git diff --exit-code -- packages/tools/mcp/data packages/tools/skill/skills packages/tools/skill/.claude-plugin packages/tools/skill/.mcp.json

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "apps/ui/dist/"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 
        with:
          token: ${{ github.token }}