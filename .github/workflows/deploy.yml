name: Deploy to GitHub Pages

on:
  # Deploy on every push to `main` — merging a pull request into `main` is a push,
  # so this covers the merge-a-PR case as well.
  push:
    branches: [main]

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Set up GitHub Actions caching for Wireit.
      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build UI app
        shell: 'bash'
        run: npm run ui:build

      - name: Check component documentation coverage
        run: npm run docs:check

      - name: Check the docs site dogfoods c2n components
        run: npm run check:dogfood

      - name: Build tools (MCP registry, skill catalog)
        run: npm run build:tools

      - name: Smoke test the MCP server
        run: npm run mcp:smoke

      - name: Test the cross-agent installer
        run: npm test -w packages/tools/skill

      - name: Generated files are up to date
        run: git diff --exit-code -- packages/tools/skill/skills packages/tools/skill/.claude-plugin packages/tools/skill/.mcp.json packages/tools/skill/plugin.json packages/tools/skill/mcp.json packages/tools/framework-types/tsconfig.vue.json 'packages/*/*/react.d.ts' 'packages/*/*/vue.d.ts' 'open-packages/*/react.d.ts' 'open-packages/*/vue.d.ts'

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'apps/ui/dist/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          token: ${{ github.token }}
