<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-confirm-dialog</title>
    <script type="module">
      import { confirm } from '/src/confirm-dialog.ts'
      const log = document.getElementById('log')
      for (const button of document.querySelectorAll('[data-open]')) {
        button.addEventListener('click', async () => {
          const answer = await document.getElementById(button.dataset.open).show()
          log.textContent = `${button.dataset.open}: ${answer}`
        })
      }
      document.getElementById('helper').addEventListener('click', async () => {
        const answer = await confirm({ heading: 'Leave without saving?', message: 'Your edits will be lost.', confirmLabel: 'Leave', destructive: true })
        log.textContent = `confirm(): ${answer}`
      })
      document.getElementById('slow').confirmAction = () => new Promise((resolve) => setTimeout(resolve, 1500))
      document.getElementById('flaky').confirmAction = () => new Promise((_, reject) => setTimeout(() => reject(new Error('Network down')), 800))
      document.getElementById('flaky').addEventListener('confirm-error', (event) => (log.textContent = `error: ${event.detail.error.message}`))
    </script>
    <style>
      body {
        padding: 24px;
        font: 14px system-ui;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      #log {
        flex-basis: 100%;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <button data-open="publish">Publish</button>
    <c2-confirm-dialog id="publish" heading="Publish changes?" message="Everyone with the link will see them." confirm-label="Publish"></c2-confirm-dialog>

    <button data-open="delete">Delete (destructive)</button>
    <c2-confirm-dialog id="delete" destructive confirm-label="Delete">
      <svg slot="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path>
      </svg>
      <span slot="heading">Delete <strong>web-components</strong>?</span>
      <p>The repository and its pull requests are removed for everyone.</p>
    </c2-confirm-dialog>

    <button data-open="slow">Async action</button>
    <c2-confirm-dialog id="slow" heading="Send invoice?" message="The customer is emailed right away." confirm-label="Send"></c2-confirm-dialog>

    <button data-open="flaky">Failing action</button>
    <c2-confirm-dialog id="flaky" destructive heading="Revoke key?" message="This fails, so the dialog stays open." confirm-label="Revoke"></c2-confirm-dialog>

    <button id="helper">confirm() helper</button>
    <p id="log"></p>
  </body>
</html>
