name: Deploy to GitHub Pages

on:
  # Deploy on every push to `main` — merging a pull request into `main` is a push,
  # so this covers the merge-a-PR case as well.
  push:
    branches: [main]

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Set up GitHub Actions caching for Wireit.
      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Every --c2-* variable apps/ui and apps/examples set or read must be a documented @cssproperty, a theme token
      # or a variable a component writes itself; reads the committed custom-elements.json, so it needs no build.
      - name: Check app CSS variables against the component contracts
        run: npm run check:css-contracts

      - name: Build UI app
        shell: 'bash'
        run: npm run ui:build
        env:
          # Browser key for the Google Maps examples, baked into the pages, so it is public either way: restrict it
          # to the site's referrers in the Google Cloud console. The literal is the development key; a
          # GOOGLE_MAPS_API_KEY repository secret, when set, takes its place.
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'AIzaSyB9u7tyP1OSxruJJeVvksagghg-3pGHI6Y' }}

      - name: Check the @c2n/components bundle size
        run: npm run check:bundle-size

      - name: Check docs examples follow the theme in light and dark
        run: npm run check:example-theme && npm test -w packages/tools/mcp

      - name: Check component documentation coverage
        run: npm run docs:check

      - name: Verify generated component manifests are committed
        run: git diff --exit-code -- ':(glob)packages/components/*/custom-elements.json' ':(glob)open-packages/*/custom-elements.json' ':(glob)packages/icons/*/custom-elements.json'

      # Diagnostic until the initial audit reaches zero; deployment keeps its existing gates meanwhile.
      - name: Style-contract static diagnostic
        continue-on-error: true
        run: |
          mkdir -p test-results/style-contracts
          node scripts/check-style-contracts.mjs --json > test-results/style-contracts/style-contract-static-report.json

      - name: Summarize style-contract diagnostic
        if: ${{ !cancelled() }}
        run: node scripts/summarize-style-contract-audit.mjs test-results/style-contracts/style-contract-static-report.json

      - name: Upload style-contract static report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-style-contract-static-report
          path: test-results/style-contracts/style-contract-static-report.json
          retention-days: 7

      - name: Check the docs site dogfoods c2n components
        run: npm run check:dogfood

      - name: Build tools (MCP registry, skill catalog)
        run: npm run build:tools

      - name: Smoke test the MCP server
        run: npm run mcp:smoke

      - name: Test the cross-agent installer
        run: npm test -w packages/tools/skill

      - name: Generated files are up to date
        run: git diff --exit-code -- packages/tools/skill/skills packages/tools/skill/.claude-plugin packages/tools/skill/.mcp.json packages/tools/skill/plugin.json packages/tools/skill/mcp.json packages/tools/framework-types/tsconfig.vue.json 'packages/*/*/react.d.ts' 'packages/*/*/vue.d.ts' 'open-packages/*/react.d.ts' 'open-packages/*/vue.d.ts' packages/umbrella

      # PNGs of every gallery card, light and dark, at the URLs the @c2n/mcp registry lists, so agents that read
      # images can see a look before choosing it. Served by Pages only; a failure here must not block the docs.
      - name: Install Chromium for the gallery screenshots
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Capture gallery screenshots
        continue-on-error: true
        run: npm run gallery:shots

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'apps/ui/dist/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          token: ${{ github.token }}
