<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-money-input</title>
    <script type="module" src="/src/money-input.ts"></script>
    <style>
      body {
        display: grid;
        gap: 16px;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }
      c2-money-input {
        width: 240px;
      }
      .ledger {
        --c2-money-input__input--text-align: right;
      }
    </style>
  </head>

  <body>
    <c2-money-input aria-label="Amount" locale="en-US" value="125000"></c2-money-input>
    <c2-money-input aria-label="Betrag" locale="de-DE" currency="EUR" value="123456"></c2-money-input>
    <c2-money-input aria-label="Yen" locale="ja-JP" currency="JPY" value="15800"></c2-money-input>
    <c2-money-input aria-label="Payout" locale="en-US" value="250000" currencies="USD;EUR;GBP;JPY" help="Paid out on Fridays."></c2-money-input>
    <c2-money-input aria-label="Adjustment" locale="en-US" min="-100000" max="100000" required></c2-money-input>
    <c2-money-input class="ledger" aria-label="Debit" locale="en-US" value="1849950"></c2-money-input>
    <c2-money-input aria-label="Refund" locale="en-US" value="12000" error error-text="Refund exceeds the charge."></c2-money-input>
    <c2-money-input aria-label="Disabled" locale="en-US" value="4999" disabled></c2-money-input>
  </body>
</html>
