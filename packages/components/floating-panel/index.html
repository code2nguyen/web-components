<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-floating-panel</title>
    <script type="module" src="/src/floating-panel.ts"></script>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font:
          14px system-ui,
          sans-serif;
        color: #18181b;
      }
      .area {
        position: relative;
        height: 360px;
        margin-top: 16px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        background: #fafafa;
      }
      .layers {
        --c2-floating-panel--inset: 16px 16px auto auto;
        --c2-floating-panel--width: 220px;
        --c2-floating-panel--min-width: 180px;
      }
    </style>
  </head>
  <body>
    <h1>c2-floating-panel</h1>
    <button id="open">Open support chat</button>
    <div class="area">
      <c2-floating-panel class="layers" open boundary="parent" minimize="collapse">
        <span slot="title">Layers</span>
        <p>Hero card</p>
        <p>Call to action</p>
      </c2-floating-panel>
      <c2-floating-panel open boundary="parent" style="--c2-floating-panel--inset: 60px auto auto 40px">
        <span slot="title">Properties</span>
        <p>X 320 · Y 148</p>
      </c2-floating-panel>
    </div>
    <c2-floating-panel id="chat" storage-key="dev-support-chat">
      <svg slot="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" /></svg>
      <span slot="title">Support chat</span>
      <p>Hi! How can we help?</p>
      <input slot="footer" aria-label="Message" placeholder="Write a message…" />
    </c2-floating-panel>
    <script type="module">
      document.querySelector('#open').addEventListener('click', () => document.querySelector('#chat').show())
    </script>
  </body>
</html>
