<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header examples</title>
    <script type="module" src="/src/header.ts"></script>
    <style>
      body {
        min-height: 150vh;
        margin: 0;
        font-family: system-ui;
        background: #fafafa;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .links {
        display: flex;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <c2-header sticky blurred>
      <a slot="brand" href="/"><strong>Northstar</strong></a>
      <div class="links"><a href="#markets">Markets</a><a href="#research">Research</a></div>
      <button slot="actions" type="button">Sign in</button>
      <button slot="mobile-trigger" type="button" aria-label="Open menu">☰</button>
    </c2-header>
  </body>
</html>
