<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>reorder-list scenarios</title>
    <style>
      body {
        margin: 32px;
        font: 16px system-ui;
        color: #18181b;
        background: white;
      }
      main {
        max-width: 800px;
      }
    </style>
    <script type="module">
      import '../src/reorder-list.ts'
      document.documentElement.dataset.modulesReady = 'true'
    </script>
  </head>
  <body>
    <main aria-label="Component scenario"></main>
    <template id="keyed-rows">
      <div data-reorder-key="alpha" data-reorder-label="Alpha task">Alpha</div>
      <div data-fixed data-reorder-key="pinned" data-reorder-label="Pinned task">Pinned</div>
      <div data-reorder-key="bravo" data-reorder-label="Bravo task">Bravo <button type="button">Open</button></div>
      <div>Unkeyed task</div>
    </template>
    <template id="scrolling-rows">
      <div style="height: 36px">Short row</div>
      <div style="height: 96px">Tall row</div>
      <div style="height: 52px">Medium row</div>
      <div style="height: 120px">Changing row</div>
    </template>
  </body>
</html>
