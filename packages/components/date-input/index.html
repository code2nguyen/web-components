<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Input</title>
    <script type="module" src="/src/date-input.ts"></script>
    <style>
      body {
        padding: 24px;
        font-family: system-ui, sans-serif;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
    </style>
  </head>

  <body>
    <main>
      <c2-date-input aria-label="Start date"></c2-date-input>
      <c2-date-input aria-label="Due date" value="2026-09-15" min="2026-09-01" max="2026-10-01" help="Within the current sprint."></c2-date-input>
      <c2-date-input aria-label="Invalid date" value="2026-09-20" error error-text="Choose a weekday."></c2-date-input>
      <c2-date-input aria-label="Read-only date" value="2026-09-15" readonly></c2-date-input>
      <c2-date-input aria-label="Disabled date" value="2026-09-15" disabled></c2-date-input>
      <c2-date-input id="from-two-days-ago" aria-label="From two days ago" help="Two days ago or later (d-2)."></c2-date-input>
      <c2-date-input id="past-only" aria-label="Past dates only" help="Yesterday or earlier (d-1)."></c2-date-input>
    </main>
    <script type="module">
      // Local-calendar YYYY-MM-DD for today + offset days (toISOString() is UTC and can be off by one).
      const isoDaysFromToday = (offset) => {
        const date = new Date()
        date.setDate(date.getDate() + offset)
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`
      }
      document.querySelector('#from-two-days-ago').min = isoDaysFromToday(-2)
      document.querySelector('#past-only').max = isoDaysFromToday(-1)
    </script>
  </body>
</html>
