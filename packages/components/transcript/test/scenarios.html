<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>transcript scenarios</title>
    <style>
      body {
        margin: 32px;
        font: 16px system-ui;
        color: #18181b;
        background: white;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 16px;
        gap: 16px;
      }
    </style>
    <script type="module">
      import './translations.ts'
      import '../src/transcript.ts'
      import '@c2n/button'
      // A silent WAV of a given length, so a real <audio> can play and seek without a file.
      window.silence = (seconds) => {
        const rate = 8000
        const samples = Math.round(rate * seconds)
        const buffer = new ArrayBuffer(44 + samples)
        const view = new DataView(buffer)
        const text = (offset, value) => [...value].forEach((char, index) => view.setUint8(offset + index, char.charCodeAt(0)))
        text(0, 'RIFF')
        view.setUint32(4, 36 + samples, true)
        text(8, 'WAVEfmt ')
        view.setUint32(16, 16, true)
        view.setUint16(20, 1, true)
        view.setUint16(22, 1, true)
        view.setUint32(24, rate, true)
        view.setUint32(28, rate, true)
        view.setUint16(32, 1, true)
        view.setUint16(34, 8, true)
        text(36, 'data')
        view.setUint32(40, samples, true)
        new Uint8Array(buffer, 44).fill(128)
        return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }))
      }
      document.documentElement.dataset.modulesReady = 'true'
    </script>
  </head>
  <body>
    <main aria-label="Component scenario"></main>
  </body>
</html>
