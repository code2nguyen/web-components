<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + Lit + TS</title>
    <script type="module" src="/src/tool-call.ts"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        padding: 24px;
      }
    </style>
  </head>

  <body>
    <div style="display: grid; gap: 8px; width: 520px">
      <c2-tool-call
        name="search_web"
        description="Searched the web for lit ssr"
        state="success"
        duration="1240"
        input='{"query":"lit ssr","limit":3}'
        output="Found 3 results"
      ></c2-tool-call>
      <c2-tool-call name="read_file" description="Reading src/app.ts" state="running" input='{"path":"src/app.ts"}'></c2-tool-call>
      <c2-tool-call name="run_tests" description="npm test" state="error" duration="8300" error-text="2 failed" open></c2-tool-call>
      <c2-tool-call name="delete_branch" description="Delete feature/login" state="pending"><button slot="actions">Approve</button></c2-tool-call>
    </div>
  </body>
</html>
