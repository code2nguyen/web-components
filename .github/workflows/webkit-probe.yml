name: WebKit regex probe (temporary)
on:
  push:
    branches: [claude/webkit-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit chromium
      - run: node .probe/run.mjs
