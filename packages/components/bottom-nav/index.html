<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>c2-bottom-nav</title>
    <script type="module" src="/src/bottom-nav.ts"></script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #18181b;
        background: #f4f4f5;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px 16px;
        display: grid;
        gap: 12px;
      }
      .card {
        background: #ffffff;
        border-radius: 14px;
        padding: 16px;
      }
      .glass {
        --c2-bottom-nav--background: rgb(255 255 255 / 0.7);
        --c2-bottom-nav--backdrop-filter: blur(18px) saturate(1.6);
        --c2-bottom-nav--border-top: none;
        --c2-bottom-nav-item__indicator__current--background: transparent;
      }
      svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Inbox</h1>
      <script>
        for (let i = 1; i <= 30; i++) document.write(`<div class="card">Message ${i}: scroll to send the bar away.</div>`)
      </script>
    </main>
    <c2-bottom-nav value="inbox" hide-on-scroll>
      <c2-bottom-nav-item value="home" href="#home">
        <svg slot="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>Home
      </c2-bottom-nav-item>
      <c2-bottom-nav-item value="search" href="#search">
        <svg slot="icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" /></svg
        >Search
      </c2-bottom-nav-item>
      <c2-bottom-nav-item value="inbox" href="#inbox" count="12">
        <svg slot="icon" viewBox="0 0 24 24">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
          <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /></svg
        >Inbox
      </c2-bottom-nav-item>
      <c2-bottom-nav-item value="profile" href="#profile" dot>
        <svg slot="icon" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" /></svg
        >Profile
      </c2-bottom-nav-item>
    </c2-bottom-nav>
  </body>
</html>
