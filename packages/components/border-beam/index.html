<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-border-beam</title>
    <script type="module" src="/src/border-beam.ts"></script>
    <style>
      body {
        display: grid;
        gap: 24px;
        padding: 32px;
        color: #18181b;
        background: #fafafa;
        font-family: system-ui, sans-serif;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        width: min(100%, 420px);
        overflow: hidden;
        padding: 24px;
        border: 1px solid #e4e4e7;
        border-radius: 14px;
        background: #ffffff;
      }
      .card p {
        margin: 8px 0 0;
        color: #71717a;
      }
      .violet {
        color: #faf5ff;
        border-color: #2e1065;
        background: #171020;
      }
      .violet p {
        color: #c4b5fd;
      }
      .violet c2-border-beam {
        --c2-border-beam__beam--color-from: #8b5cf6;
        --c2-border-beam__beam--color-to: #f0abfc;
        --c2-border-beam__beam--width: 2px;
        --c2-border-beam__beam--size: 120px;
        --c2-border-beam__beam--duration: 4s;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <strong>Workspace overview</strong>
      <p>Review task status and deployment health.</p>
      <c2-border-beam></c2-border-beam>
    </div>
    <div class="card violet">
      <strong>AI workflow is live</strong>
      <p>Three agents are coordinating the release.</p>
      <c2-border-beam reverse count="2"></c2-border-beam>
    </div>
  </body>
</html>
