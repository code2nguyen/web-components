name: Release to npm

# Manual only: publishing is deliberate. Run it from the Actions tab, pick the bump, and the whole
# monorepo is versioned together (fixed versioning, see the `version` field in lerna.json).
# A real release writes its version commit to `release/v<version>` and opens a PR back to the selected
# source branch. Merge that PR before starting the next version. If any step fails, rerun the same run:
# it resumes the release branch or tag and publishes only packages that are still missing from npm.
#
# Requires a repository secret named NPM_TOKEN: an npm **automation** token (Access Tokens ->
# Generate New Token -> Automation). A classic "publish" token is refused when the account or the
# @c2n scope enforces 2FA, because automation tokens are the only kind that bypass the OTP prompt.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump applied to every package'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - premajor
          - preminor
          - prepatch
          - prerelease
      dist_tag:
        description: 'npm dist-tag (use "next" for a prerelease so it does not become the default install)'
        type: string
        default: latest
      dry_run:
        description: 'Verify, version locally and pack — publish nothing, tag nothing, push nothing'
        type: boolean
        default: false

permissions:
  # The workflow pushes an unprotected release branch and opens the version PR itself.
  contents: write
  pull-requests: write
  # npm provenance: lerna turns it on by itself for a public repo running in GitHub Actions, but only
  # if it can mint an OIDC token. Without this the publish still works, just unattested.
  id-token: write

# Two releases at once would race on tags and on the registry.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # NPM_TOKEN lives on this environment, and an environment secret is only injected into a job that
    # declares the environment. Any protection rule set on it (required reviewer, wait timer, allowed
    # branches) therefore gates the release too.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # lerna reads the tag history to work out the last release; a shallow clone hides it.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Writes the .npmrc that maps the registry to NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      # Set up GitHub Actions caching for Wireit.
      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Install dependencies
        run: npm ci

      # Lerna's normal publish command versions, commits, tags, pushes and publishes as one operation. A protected
      # source branch can reject that push after the tag has already reached GitHub, leaving every rerun stuck on
      # "tag already exists". Resolve the target without running version lifecycle scripts, then resume from either
      # durable checkpoint. The actual versioning happens after the MCP registry it consumes has been built.
      - name: Resolve release attempt
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          source_branch="$GITHUB_REF_NAME"
          current_version="$(node -p "require('./lerna.json').version")"
          version="$(node -e '
            const semver = require("semver")
            const prerelease = semver.prerelease(process.argv[1])
            const preid = typeof prerelease?.[0] === "string" ? prerelease[0] : "alpha"
            const next = semver.inc(process.argv[1], process.argv[2], preid)
            if (!next) process.exit(1)
            console.log(next)
          ' "$current_version" "$BUMP")"
          release_branch="release/v$version"
          checkpoint='new'

          if git show-ref --verify --quiet "refs/remotes/origin/$release_branch"; then
            git checkout --force --detach "refs/remotes/origin/$release_branch"
            checkpoint='branch'
          elif git show-ref --verify --quiet "refs/tags/v$version"; then
            git checkout --force --detach "v$version^{commit}"
            checkpoint='tag'
          fi

          if [ "$checkpoint" != 'new' ]; then
            actual_version="$(node -p "require('./lerna.json').version")"
            if [ "$actual_version" != "$version" ]; then
              echo "Checkpoint version $actual_version does not match requested version $version" >&2
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "source_branch=$source_branch"
            echo "release_branch=$release_branch"
            echo "checkpoint=$checkpoint"
          } >> "$GITHUB_OUTPUT"

      # A resumed attempt may have checked out a release commit with a different lockfile.
      - name: Reinstall dependencies from the release checkpoint
        if: ${{ steps.release.outputs.checkpoint != 'new' }}
        run: npm ci

      # The same gates as the deploy workflow: a release must not be able to ship what CI would reject.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build all packages
        run: npm run build

      - name: Check component documentation coverage
        run: npm run docs:check

      - name: Build tools (MCP registry, skill catalog)
        run: npm run build:tools

      - name: Smoke test the MCP server
        run: npm run mcp:smoke

      - name: Test the cross-agent installer
        run: npm test -w packages/tools/skill

      - name: Generated files are up to date
        run: git diff --exit-code -- packages/tools/skill/skills packages/tools/skill/.claude-plugin packages/tools/skill/.mcp.json packages/tools/skill/plugin.json packages/tools/skill/mcp.json

      - name: Version new release
        if: ${{ steps.release.outputs.checkpoint == 'new' }}
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npx lerna version "$BUMP" --no-private --exact --yes --force-publish --no-push --no-git-tag-version
          actual_version="$(node -p "require('./lerna.json').version")"
          if [ "$actual_version" != "$VERSION" ]; then
            echo "Lerna produced version $actual_version; expected $VERSION" >&2
            exit 1
          fi
          # Some generated public metadata embeds its package version. Regenerate it after Lerna updates package.json.
          npm run build:tools

      # Each package ships only what its `files` field lists, and `dist/` is built above and never
      # committed — so this is the one place a missing entry shows up before it reaches the registry.
      - name: Show what every package would publish
        run: npx lerna exec --no-private --concurrency 1 -- npm pack --dry-run

      - name: Configure git author for the version commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit the new version
        if: ${{ !inputs.dry_run && steps.release.outputs.checkpoint == 'new' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git add --update
          git commit -m "chore(release): publish v$VERSION"

      # The original v0.0.7 workflow generated framework metadata before versioning. Rebuilding that immutable tag
      # therefore repairs a stale version comment. Commit build output only in the runner so Lerna gets a clean tree;
      # publication still records the immutable release tag below as gitHead.
      - name: Checkpoint repaired output for an existing tag
        if: ${{ !inputs.dry_run && steps.release.outputs.checkpoint == 'tag' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git add --update
          if git diff --cached --quiet; then
            echo "The tagged release already has current generated output."
          else
            git commit -m "chore(release): repair generated output for v$VERSION"
          fi

      # A tag created by an older failed workflow can contain a historical workflow file. GitHub's Actions token is
      # deliberately not allowed to create a branch from that commit, so tagged attempts publish first and create a
      # clean version-sync branch from the current source branch below.
      - name: Push release checkpoint
        if: ${{ !inputs.dry_run && steps.release.outputs.checkpoint != 'tag' }}
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
        run: git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Publish missing packages
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHECKPOINT: ${{ steps.release.outputs.checkpoint }}
          VERSION: ${{ steps.release.outputs.version }}
        # `from-package` queries npm and publishes only versions that are still absent. This makes both a partial
        # registry failure and a failure in a later GitHub step safe to rerun.
        run: |
          git_head="$(git rev-parse HEAD)"
          if [ "$CHECKPOINT" = 'tag' ]; then
            git_head="$(git rev-list -n 1 "v$VERSION")"
          fi
          npx lerna publish from-package --dist-tag ${{ inputs.dist_tag }} --git-head "$git_head" --no-private --yes

      - name: Prepare version sync for an existing tag
        if: ${{ !inputs.dry_run && steps.release.outputs.checkpoint == 'tag' }}
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git checkout --force -B "$RELEASE_BRANCH" "origin/$SOURCE_BRANCH"
          npm ci
          npm run build:tools
          npx lerna version "$BUMP" --no-private --exact --yes --force-publish --no-push --no-git-tag-version
          actual_version="$(node -p "require('./lerna.json').version")"
          if [ "$actual_version" != "$VERSION" ]; then
            echo "Lerna produced version $actual_version; expected $VERSION" >&2
            exit 1
          fi
          npm run build:tools
          git add --update
          git commit -m "chore(release): publish v$VERSION"

      - name: Push version sync for an existing tag
        if: ${{ !inputs.dry_run && steps.release.outputs.checkpoint == 'tag' }}
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
        run: git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Open version pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          pr_url="$(gh pr list --head "$RELEASE_BRANCH" --base "$SOURCE_BRANCH" --state all --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            if ! gh pr create \
              --head "$RELEASE_BRANCH" \
              --base "$SOURCE_BRANCH" \
              --title "chore(release): publish v$VERSION" \
              --body "Records the version metadata for the retryable v$VERSION npm release."; then
              echo "::warning::Could not open the version PR automatically. Create it from $RELEASE_BRANCH into $SOURCE_BRANCH."
            fi
          else
            echo "Version PR already exists: $pr_url"
          fi

      - name: Push release tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git tag -a "v$VERSION" -m "v$VERSION"
          fi
          git push origin "refs/tags/v$VERSION"

      # Turn the successfully published tag into a GitHub Release. A rerun treats an existing release as success.
      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          prerelease=''
          case "$VERSION" in *-*) prerelease='--prerelease' ;; esac
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists."
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --generate-notes \
              --verify-tag \
              $prerelease
          fi

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Release"
            echo
            echo "- bump: \`${{ inputs.bump }}\`"
            echo "- dist-tag: \`${{ inputs.dist_tag }}\`"
            echo "- dry run: \`${{ inputs.dry_run }}\`"
            echo "- checkpoint: \`${{ steps.release.outputs.checkpoint }}\`"
            echo "- version now in lerna.json: \`$(node -p "require('./lerna.json').version")\`"
          } >> "$GITHUB_STEP_SUMMARY"
