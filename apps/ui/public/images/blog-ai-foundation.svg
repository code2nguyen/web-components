<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Build the foundation, then compose the application</title>
  <desc id="description">Reusable components, architecture, business knowledge, AI skills and specialist agents come together to support a coherent application.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="1" stop-color="#eef4ff" />
    </linearGradient>
    <linearGradient id="product" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f4f7fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#15315b" flood-opacity="0.10" />
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#9db9e7" opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#canvas)" />
  <path d="M0 368C170 300 240 425 408 370s258-130 401-42 248 20 391-79v271H0Z" fill="#e7effd" opacity="0.72" />
  <rect width="1200" height="520" rx="28" fill="url(#dots)" opacity="0.55" />

  <text x="72" y="73" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.8">A STRONGER START FOR AI-BUILT APPLICATIONS</text>
  <text x="72" y="115" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.7">Give the agent a foundation to build on.</text>

  <g filter="url(#shadow)">
    <rect x="68" y="163" width="410" height="284" rx="22" fill="#fff" stroke="#d7e2f3" />
  </g>
  <text x="98" y="202" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">THE FOUNDATION</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="96" y="222" width="354" height="42" rx="11" fill="#eaf2ff" />
