<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-duration-input</title>
    <script type="module" src="/src/duration-input.ts"></script>
    <style>
      body {
        display: grid;
        gap: 16px;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }
      c2-duration-input {
        width: 240px;
      }
    </style>
  </head>

  <body>
    <c2-duration-input aria-label="Estimate"></c2-duration-input>
    <c2-duration-input aria-label="Meeting" value="5400" step="900"></c2-duration-input>
    <c2-duration-input aria-label="Long" format="long" value="5400"></c2-duration-input>
    <c2-duration-input aria-label="Clock" format="clock" value="3930"></c2-duration-input>
    <c2-duration-input aria-label="Time spent" day-hours="8" week-days="5" value="43200" help="A day is 8 hours."></c2-duration-input>
    <c2-duration-input aria-label="Break" max="3600" value="7200"></c2-duration-input>
  </body>
</html>
