    <rect x="700" y="312" width="63" height="7" rx="3.5" fill="#c8d5e9" />
    <rect x="700" y="330" width="55" height="7" rx="3.5" fill="#c8d5e9" />
    <rect x="700" y="348" width="61" height="7" rx="3.5" fill="#c8d5e9" />
    <rect x="700" y="369" width="43" height="12" rx="6" fill="#dce9ff" />

    <text x="802" y="297" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">A feature built from shared parts</text>
    <rect x="802" y="311" width="253" height="7" rx="3.5" fill="#dfe6f0" />
    <rect x="802" y="326" width="211" height="7" rx="3.5" fill="#e7ecf4" />
    <rect x="802" y="351" width="121" height="39" rx="9" fill="#eaf2ff" stroke="#c7dcff" />
    <rect x="937" y="351" width="118" height="39" rx="9" fill="#f5f1ff" stroke="#e2d7ff" />
    <circle cx="822" cy="370" r="7" fill="#2563eb" />
    <rect x="837" y="366" width="62" height="7" rx="3.5" fill="#77a3e5" />
    <circle cx="957" cy="370" r="7" fill="#8b5cf6" />
    <rect x="972" y="366" width="57" height="7" rx="3.5" fill="#b29bec" />
