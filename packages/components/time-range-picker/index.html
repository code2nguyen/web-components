<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-time-range-picker</title>
    <script type="module" src="/src/time-range-picker.ts"></script>
    <style>
      body {
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 32px;
        font-family: system-ui, sans-serif;
      }
      section {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
      }
      h2 {
        width: 100%;
        margin: 0;
        font-size: 14px;
      }
      .violet {
        --c2-time-range-picker__preset__selected--background: #f3e8ff;
        --c2-time-range-picker__preset__selected--color: #7e22ce;
        --c2-time-range-picker__apply--background: #7c3aed;
      }
    </style>
  </head>
  <body>
    <section>
      <h2>Default and named ranges</h2>
      <c2-time-range-picker></c2-time-range-picker>
      <c2-time-range-picker from="now-1d/d" to="now-1d/d"></c2-time-range-picker>
    </section>
    <section>
      <h2>Shift, zoom and auto-refresh</h2>
      <c2-time-range-picker id="dashboard" nav from="now-6h" refresh-intervals="10s 30s 1m 5m"></c2-time-range-picker>
      <output id="log">No change yet</output>
    </section>
    <section>
      <h2>Absolute, in a time zone</h2>
      <c2-time-range-picker nav from="2026-10-20T09:00" to="2026-10-21T09:00" time-zone="UTC" time-zones="UTC Europe/Paris Asia/Tokyo"></c2-time-range-picker>
    </section>
    <section>
      <h2>Custom presets, themed</h2>
      <c2-time-range-picker
        class="violet"
        from="now-90m"
        presets='[{"from":"now-90m","to":"now"},{"from":"now/d","to":"now","label":"Since midnight"},{"from":"now-1w/w","to":"now-1w/w"}]'
      ></c2-time-range-picker>
    </section>
    <section>
      <h2>Invalid and disabled</h2>
      <c2-time-range-picker from="2026-10-22" to="2026-10-21"></c2-time-range-picker>
      <c2-time-range-picker disabled nav></c2-time-range-picker>
    </section>
    <script type="module">
      const picker = document.querySelector('#dashboard')
      const log = document.querySelector('#log')
      picker.addEventListener('change', (event) => (log.textContent = `change ${JSON.stringify(event.detail)}`))
      picker.addEventListener('refresh', (event) => (log.textContent = `refresh ${event.detail.from.toISOString()} → ${event.detail.to.toISOString()}`))
    </script>
  </body>
</html>
