  <rect x="847" y="431" width="70" height="28" rx="14" fill="#eaf2ff" />
  <text x="882" y="450" text-anchor="middle" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">REUSE</text>
  <rect x="925" y="431" width="84" height="28" rx="14" fill="#f3edff" />
  <text x="967" y="450" text-anchor="middle" fill="#5b38a7" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">COMPOSE</text>
  <rect x="1017" y="431" width="78" height="28" rx="14" fill="#fff5db" />
  <text x="1056" y="450" text-anchor="middle" fill="#745100" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">IMPROVE</text>
</svg>
