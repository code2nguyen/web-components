<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-split-panel</title>
    <script type="module" src="/src/split-panel.ts"></script>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #18181b;
      }
      main {
        display: grid;
        gap: 32px;
        max-width: 760px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      c2-split-panel {
        height: 200px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        overflow: hidden;
      }
      .pane {
        padding: 12px;
      }
      .dark {
        --c2-split-panel__divider--opacity: 1;
        --c2-split-panel__divider--background: #3f3f46;
        --c2-split-panel__divider__hover--background: #71717a;
        --c2-split-panel__handle--background: #27272a;
        --c2-split-panel__handle--border: 1px solid #3f3f46;
        --c2-split-panel__handle--color: #a1a1aa;
        --c2-split-panel__start--background: #18181b;
        --c2-split-panel__end--background: #09090b;
        color: #e4e4e7;
      }
      .thick {
        --c2-split-panel__divider--opacity: 1;
        --c2-split-panel__divider--size: 8px;
        --c2-split-panel__divider--background: #f4f4f5;
        --c2-split-panel__handle--display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>Default</h2>
        <c2-split-panel>
          <div slot="start" class="pane">Start</div>
          <div slot="end" class="pane">End</div>
        </c2-split-panel>
      </section>
      <section>
        <h2>Vertical, bounded 20–80%</h2>
        <c2-split-panel orientation="vertical" position="35" min="20" max="80">
          <div slot="start" class="pane">Top</div>
          <div slot="end" class="pane">Bottom</div>
        </c2-split-panel>
      </section>
      <section>
        <h2>Sidebar: primary start, snaps to 25/50/75</h2>
        <c2-split-panel primary="start" position="30" snap="25 50 75">
          <div slot="start" class="pane">Sidebar keeps its width when the window resizes</div>
          <div slot="end" class="pane">Content</div>
        </c2-split-panel>
      </section>
      <section>
        <h2>Nested</h2>
        <c2-split-panel position="30">
          <div slot="start" class="pane">Files</div>
          <c2-split-panel slot="end" orientation="vertical" position="65" style="border: 0; border-radius: 0">
            <div slot="start" class="pane">Editor</div>
            <div slot="end" class="pane">Terminal</div>
          </c2-split-panel>
        </c2-split-panel>
      </section>
      <section>
        <h2>Themed</h2>
        <c2-split-panel class="dark">
          <div slot="start" class="pane">Dark</div>
          <div slot="end" class="pane">Panels</div>
        </c2-split-panel>
      </section>
      <section>
        <h2>Thick divider, no grip</h2>
        <c2-split-panel class="thick">
          <div slot="start" class="pane">Start</div>
          <div slot="end" class="pane">End</div>
        </c2-split-panel>
      </section>
      <section>
        <h2>Disabled</h2>
        <c2-split-panel disabled>
          <div slot="start" class="pane">Locked</div>
          <div slot="end" class="pane">Layout</div>
        </c2-split-panel>
      </section>
    </main>
  </body>
</html>
