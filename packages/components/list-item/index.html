<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-list-item</title>
    <script type="module" src="/src/list-item.ts"></script>
    <style>
      body {
        padding: 24px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        flex-wrap: wrap;
      }
      .col {
        display: flex;
        flex-direction: column;
        width: 200px;
      }
      .col h4 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 500;
        color: #71717a;
      }
      .accent-bar {
        --c2-list-item--border-top-left-radius: 0px;
        --c2-list-item--border-top-right-radius: 0px;
        --c2-list-item--border-bottom-left-radius: 0px;
        --c2-list-item--border-bottom-right-radius: 0px;
        --c2-list-item--padding-left: 12px;
        --c2-list-item--border-left: 3px solid transparent;
        --c2-list-item__selected--border-left: 3px solid #2563eb;
        --c2-list-item__selected--background: transparent;
        --c2-list-item__selected--color: #2563eb;
      }
      .dark {
        padding: 6px;
        border-radius: 10px;
        background: #18181b;
        --c2-list-item--color: #d4d4d8;
        --c2-list-item__hover--background: #27272a;
        --c2-list-item__selected--background: #3f3f46;
        --c2-list-item__selected--color: #ffffff;
      }
      .two-line {
        --c2-list-item--padding-top: 8px;
        --c2-list-item--padding-bottom: 8px;
        --c2-list-item--line-height: 18px;
      }
      .two-line small {
        display: block;
        font-size: 12px;
        color: #71717a;
      }
      kbd {
        width: auto;
        height: auto;
        font-family: inherit;
        font-size: 11px;
        color: #a1a1aa;
      }
    </style>
  </head>

  <body>
    <div class="row">
      <div class="col">
        <h4>States</h4>
        <c2-list-item id="events">Default (click me)</c2-list-item>
        <c2-list-item selected>Selected</c2-list-item>
        <c2-list-item disabled>Disabled</c2-list-item>
        <c2-list-item value="from-value"></c2-list-item>
        <c2-list-item value="x" label="From label"></c2-list-item>
      </div>
      <div class="col accent-bar">
        <h4>Accent bar</h4>
        <c2-list-item selected>Selected</c2-list-item>
        <c2-list-item>Default</c2-list-item>
      </div>
      <div class="col dark">
        <c2-list-item selected>Selected</c2-list-item>
        <c2-list-item>Default</c2-list-item>
        <c2-list-item disabled>Disabled</c2-list-item>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <h4>Icons</h4>
        <c2-list-item selected>
          <svg slot="prefix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
            <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
          </svg>
          Inbox
          <kbd slot="suffix-icon">⌘I</kbd>
        </c2-list-item>
        <c2-list-item>
          <svg slot="prefix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="21 8 21 21 3 21 3 8"></polyline>
            <rect x="1" y="3" width="22" height="5"></rect>
            <line x1="10" y1="12" x2="14" y2="12"></line>
          </svg>
          Archive
          <svg slot="suffix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </c2-list-item>
      </div>
      <div class="col two-line">
        <h4>Two lines</h4>
        <c2-list-item label="Pro">Pro<small>Unlimited projects, priority support</small></c2-list-item>
        <c2-list-item label="Team" selected>Team<small>Everything in Pro, plus SSO</small></c2-list-item>
      </div>
    </div>

    <p id="log">Click the first row to log selected-change</p>

    <script type="module">
      const item = document.getElementById('events')
      const log = document.getElementById('log')
      item.addEventListener('selected-change', (event) => (log.textContent = `selected-change → ${JSON.stringify(event.detail)}`))
    </script>
  </body>
</html>
