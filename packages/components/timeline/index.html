<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-timeline</title>
    <script type="module" src="/src/timeline.ts"></script>
    <style>
      body {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 48px;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 14px;
        color: #71717a;
      }
      .icons {
        --c2-timeline-item__marker--size: 24px;
        --c2-timeline-item__marker--border: 1px solid #e4e4e7;
      }
      .ink {
        --c2-timeline-item__marker--size: 10px;
        --c2-timeline-item__marker--background: #18181b;
        --c2-timeline-item__marker--border: 2px solid #18181b;
        --c2-timeline-item__connector--width: 1px;
        --c2-timeline-item__label--font-weight: 600;
      }
    </style>
  </head>

  <body>
    <section>
      <h2>Stacked</h2>
      <c2-timeline aria-label="Order history">
        <c2-timeline-item label="Order placed" timestamp="Sep 12, 09:14" datetime="2026-09-12T09:14" tone="success"
          >Paid with a card ending 4242.</c2-timeline-item
        >
        <c2-timeline-item label="Shipped" timestamp="Sep 13, 16:02" datetime="2026-09-13T16:02" tone="primary">Handed to the carrier.</c2-timeline-item>
        <c2-timeline-item label="Delivery delayed" timestamp="Sep 15" tone="warning">Weather at the regional hub.</c2-timeline-item>
        <c2-timeline-item label="Out for delivery" timestamp="Expected Sep 16"></c2-timeline-item>
      </c2-timeline>
    </section>

    <section>
      <h2>Split</h2>
      <c2-timeline layout="split" aria-label="Milestones">
        <c2-timeline-item label="Kick-off" timestamp="Jan 2026" tone="success"></c2-timeline-item>
        <c2-timeline-item label="Public beta" timestamp="May 2026" tone="success">Opened to 2,000 teams.</c2-timeline-item>
        <c2-timeline-item label="General availability" timestamp="Oct 2026" tone="primary"></c2-timeline-item>
      </c2-timeline>
    </section>

    <section>
      <h2>Slots and icon markers</h2>
      <c2-timeline class="icons" aria-label="Activity">
        <c2-timeline-item tone="danger">
          <svg slot="marker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
          <span slot="label"><a href="#">Deploy #412</a> failed</span>
          <span slot="timestamp">2 min ago</span>
        </c2-timeline-item>
        <c2-timeline-item label="Build passed" timestamp="5 min ago" tone="success">
          <svg slot="marker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
        </c2-timeline-item>
      </c2-timeline>
    </section>

    <section>
      <h2>Themed</h2>
      <c2-timeline class="ink" layout="split" aria-label="Changelog">
        <c2-timeline-item label="v2.4.0" timestamp="Sep 24">Adds the timeline component.</c2-timeline-item>
        <c2-timeline-item label="v2.3.1" timestamp="Sep 02">Fixes focus rings in Safari.</c2-timeline-item>
      </c2-timeline>
    </section>
  </body>
</html>
