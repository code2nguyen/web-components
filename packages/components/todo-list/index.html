<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@c2n/todo-list</title>
    <script type="module" src="/src/todo-list.ts"></script>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: system-ui, sans-serif;
        background: #eceef2;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 24px;
        align-items: start;
      }
      .brand {
        --c2-todo-list__accent--color: #7c3aed;
        --c2-todo-list__container--border-radius: 20px;
        --c2-todo-list__container--border: 0;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <c2-todo-list
        heading="This week"
        customizable
        storage-key="harness-this-week"
        persist-tasks
        tasks='[
          {"label": "Send the Q3 report to Léa", "icon": "mail", "done": true, "due": "Mon"},
          {"label": "Dentist appointment", "note": "Dr. Martin, 14 rue Oberkampf", "due": "Tue 9:30"},
          {"label": "Renew passport", "highlight": "yellow", "due": "Today", "urgent": true},
          {"label": "Call the plumber about the leak", "dropped": true},
          {"label": "Book the train to Lyon", "icon": "flight", "note": "Friday evening, back Sunday"},
          {"label": "Birthday present for Anna", "icon": "gift", "ink": "violet", "due": "Sat"},
          {"label": "Pay the electricity bill", "archived": true}
        ]'
      ></c2-todo-list>

      <c2-todo-list
        heading="Groceries"
        customizable
        tasks='[
          {"label": "Tomatoes", "icon": "vegetables", "note": "6, on the vine", "done": true},
          {"label": "Green lentils", "icon": "legumes", "note": "500 g"},
          {"label": "Oat milk", "icon": "milk", "note": "2 L · barista", "done": true},
          {"label": "Comté", "icon": "cheese", "highlight": "orange"},
          {"label": "Salmon fillets", "icon": "fish"},
          {"label": "Sourdough loaf", "icon": "bread"}
        ]'
      ></c2-todo-list>

      <c2-todo-list
        class="brand"
        heading="Reading list"
        progress="hero"
        tasks='[
          {"label": "Piranesi", "done": true},
          {"label": "The Overstory", "done": true},
          {"label": "Klara and the Sun", "highlight": "violet"},
          {"label": "Tomorrow, and Tomorrow, and Tomorrow"}
        ]'
      ></c2-todo-list>

      <c2-todo-list
        heading="Weekend"
        customizable
        readonly
        icon="none"
        tasks='[{"label": "Long run", "done": true}, {"label": "Farmers market"}]'
      ></c2-todo-list>

      <c2-todo-list heading="Someday" customizable>
        <span slot="empty">Nothing planned. Add something fun.</span>
      </c2-todo-list>
    </div>
  </body>
</html>
