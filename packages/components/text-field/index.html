<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-text-field</title>
    <script type="module" src="/src/text-field.ts"></script>
    <script type="module" src="/src/text-field-clear.ts"></script>
    <style>
      body {
        padding: 24px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        flex-wrap: wrap;
      }
      c2-text-field {
        width: 220px;
      }
      .adornment {
        width: auto;
        height: auto;
        font-size: 13px;
        color: #71717a;
      }
      .soft {
        --c2-text-field--background: #f4f4f5;
        --c2-text-field--border-top: 1px solid transparent;
        --c2-text-field--border-right: 1px solid transparent;
        --c2-text-field--border-bottom: 1px solid transparent;
        --c2-text-field--border-left: 1px solid transparent;
        --c2-text-field__hover--border-top: 1px solid transparent;
        --c2-text-field__hover--border-right: 1px solid transparent;
        --c2-text-field__hover--border-bottom: 1px solid transparent;
        --c2-text-field__hover--border-left: 1px solid transparent;
        --c2-text-field__focus--background: #ffffff;
      }
      .pill {
        --c2-text-field--border-top-left-radius: 999px;
        --c2-text-field--border-top-right-radius: 999px;
        --c2-text-field--border-bottom-left-radius: 999px;
        --c2-text-field--border-bottom-right-radius: 999px;
        --c2-text-field--padding-left: 16px;
      }
      .dark {
        --c2-text-field--background: #18181b;
        --c2-text-field--color: #f4f4f5;
        --c2-text-field__placeholder--color: #a1a1aa;
        --c2-text-field__icon--color: #a1a1aa;
        --c2-text-field--border-top: 1px solid #3f3f46;
        --c2-text-field--border-right: 1px solid #3f3f46;
        --c2-text-field--border-bottom: 1px solid #3f3f46;
        --c2-text-field--border-left: 1px solid #3f3f46;
      }
    </style>
  </head>

  <body>
    <div class="row">
      <c2-text-field placeholder="Placeholder" id="events"></c2-text-field>
      <c2-text-field value="Ada Lovelace"></c2-text-field>
      <c2-text-field type="email" placeholder="you@example.com" autocomplete="email"></c2-text-field>
      <c2-text-field type="password" value="hunter2"></c2-text-field>
      <span id="log">Type in the first field to log input / change</span>
    </div>

    <div class="row">
      <c2-text-field disabled value="Disabled"></c2-text-field>
      <c2-text-field readonly value="Read only"></c2-text-field>
      <c2-text-field error value="ada@example" error-text="Enter a valid email address."></c2-text-field>
      <c2-text-field placeholder="Username" help="Lowercase letters and digits only."></c2-text-field>
    </div>

    <div class="row">
      <c2-text-field type="search" clearable placeholder="Search">
        <svg slot="prefix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </c2-text-field>
      <c2-text-field type="number" placeholder="0.00">
        <span slot="prefix-icon" class="adornment">$</span>
        <span slot="suffix-icon" class="adornment">USD</span>
      </c2-text-field>
      <c2-text-field maxlength="24" value="Quarterly report" help="Shown in the sidebar."></c2-text-field>
      <c2-text-field placeholder="API key">
        <svg slot="help-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </c2-text-field>
    </div>

    <div class="row">
      <c2-text-field class="soft" placeholder="Soft filled"></c2-text-field>
      <c2-text-field class="pill" placeholder="Pill"></c2-text-field>
      <c2-text-field class="dark" placeholder="Dark"></c2-text-field>
      <c2-text-field-clear placeholder="c2-text-field-clear (legacy subclass)" value="Hello"></c2-text-field-clear>
    </div>

    <script type="module">
      const field = document.getElementById('events')
      const log = document.getElementById('log')
      field.addEventListener('input', () => (log.textContent = `input → "${field.value}"`))
      field.addEventListener('change', () => (log.textContent = `change → "${field.value}"`))
    </script>
  </body>
</html>
