<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">AI-assisted application development loop</title>
  <desc id="description">
    A clockwise cycle of specification, design, implementation and validation surrounds an AI agent. A human engineer reviews, clarifies and refines the work
    throughout the cycle.
  </desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfdff" />
      <stop offset="1" stop-color="#f0f5ff" />
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#18345c" flood-opacity="0.09" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 10 6 1 11" fill="none" stroke="#7396d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#b9cbea" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1200" height="660" rx="28" fill="url(#canvas)" />
  <rect width="1200" height="660" rx="28" fill="url(#dot-grid)" opacity="0.55" />
  <text x="600" y="54" text-anchor="middle" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">
    THE ENGINEERING CYCLE REMAINS
  </text>
  <text x="600" y="88" text-anchor="middle" fill="#18243a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.4">
    AI drafts at every stage. People steer the loop.
  </text>

  <!-- Directional paths sit behind the stage cards. -->
  <g fill="none" stroke="#7396d0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M748 160C820 166 862 191 889 226" />
    <path d="M914 345C890 396 839 430 751 447" />
    <path d="M449 447C361 430 310 396 286 345" />
    <path d="M311 226C338 191 380 166 452 160" />
  </g>

  <!-- Specify -->
  <g filter="url(#card-shadow)">
    <rect x="450" y="112" width="300" height="102" rx="18" fill="#fff" stroke="#d7e3f5" />
  </g>
  <circle cx="485" cy="147" r="16" fill="#eaf2ff" />
  <path d="M479 143h12m-12 6h12m-12 6h8" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
  <text x="512" y="151" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Specify</text>
  <text x="478" y="185" fill="#59677e" font-family="Inter, Arial, sans-serif" font-size="14">Goals · constraints · acceptance criteria</text>

  <!-- Design -->
  <g filter="url(#card-shadow)">
    <rect x="800" y="235" width="310" height="110" rx="18" fill="#fff" stroke="#e3dafa" />
  </g>
  <circle cx="837" cy="272" r="16" fill="#f3edff" />
  <path d="M831 269h12m-12 6h12m-12 6h8" stroke="#8056d8" stroke-width="2" stroke-linecap="round" />
  <text x="864" y="276" fill="#5b38a7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Design</text>
  <text x="830" y="315" fill="#59677e" font-family="Inter, Arial, sans-serif" font-size="14">Data · architecture · interactions</text>

  <!-- Implement -->
  <g filter="url(#card-shadow)">
    <rect x="450" y="412" width="300" height="102" rx="18" fill="#fff" stroke="#f0dfb0" />
  </g>
  <circle cx="485" cy="447" r="16" fill="#fff5db" />
  <path d="m481 443-5 4 5 4m8-8 5 4-5 4m-2-11-4 14" fill="none" stroke="#ac7907" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <text x="512" y="451" fill="#745100" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Implement</text>
  <text x="478" y="485" fill="#59677e" font-family="Inter, Arial, sans-serif" font-size="14">Components · patterns · code</text>

  <!-- Validate -->
  <g filter="url(#card-shadow)">
    <rect x="90" y="235" width="310" height="110" rx="18" fill="#fff" stroke="#f3d4d1" />
  </g>
  <circle cx="127" cy="272" r="16" fill="#ffecea" />
  <path d="m120 272 5 5 9-10" fill="none" stroke="#c4514c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="154" y="276" fill="#993d3a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Validate</text>
  <text x="120" y="315" fill="#59677e" font-family="Inter, Arial, sans-serif" font-size="14">POC · MVP · automated + E2E tests</text>

  <!-- Agent at the centre of the cycle. -->
  <circle cx="600" cy="316" r="82" fill="#eaf2ff" stroke="#c9dcfb" stroke-width="2" />
  <circle cx="600" cy="282" r="21" fill="#2563eb" />
  <path d="M592 282h16m-13-5 4 5-4 5m10-10-4 5 4 5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <text x="600" y="326" text-anchor="middle" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1">
    AI AGENT
  </text>
  <text x="600" y="350" text-anchor="middle" fill="#526782" font-family="Inter, Arial, sans-serif" font-size="13">works through each stage</text>

  <!-- Human role sits across the entire loop. -->
  <rect x="322" y="560" width="556" height="58" rx="29" fill="#18243a" />
  <circle cx="360" cy="589" r="11" fill="#efc94c" />
  <path d="M355 589h10m-5-5v10" stroke="#18243a" stroke-width="1.7" stroke-linecap="round" />
  <text x="388" y="594" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Human engineer</text>
  <text x="531" y="594" fill="#c6d4eb" font-family="Inter, Arial, sans-serif" font-size="14">clarifies · reviews · refines</text>
</svg>
