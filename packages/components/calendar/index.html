<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-calendar</title>
    <script type="module" src="/src/calendar.ts"></script>
    <style>
      body {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 32px;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }
      section {
        display: grid;
        gap: 8px;
      }
      h3 {
        margin: 0;
        color: #71717a;
        font-size: 12px;
        font-weight: 500;
      }
      .brand {
        --c2-calendar__day__selected--background: #7c3aed;
        --c2-calendar__day__today--color: #7c3aed;
        --c2-calendar__day--border-radius: 999px;
        --c2-calendar--box-shadow: 0 12px 32px rgba(24, 24, 27, 0.08);
      }
    </style>
  </head>

  <body>
    <section>
      <h3>Default</h3>
      <c2-calendar></c2-calendar>
    </section>
    <section>
      <h3>Selected value, week starts Sunday</h3>
      <c2-calendar value="2026-09-18" week-start="sunday"></c2-calendar>
    </section>
    <section>
      <h3>min / max</h3>
      <c2-calendar value="2026-09-10" min="2026-09-05" max="2026-09-25"></c2-calendar>
    </section>
    <section>
      <h3>Themed</h3>
      <c2-calendar class="brand" value="2026-09-22"></c2-calendar>
    </section>
    <section>
      <h3>Disabled</h3>
      <c2-calendar value="2026-09-10" disabled></c2-calendar>
    </section>
  </body>
</html>
