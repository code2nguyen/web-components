    <text x="144" y="248" fill="#1e3a8a" font-size="16" font-weight="700">Reusable components</text>

    <rect x="96" y="273" width="354" height="42" rx="11" fill="#f3edff" />
    <rect x="96" y="273" width="5" height="42" rx="2.5" fill="#8b5cf6" />
    <circle cx="122" cy="294" r="9" fill="#8b5cf6" opacity="0.17" />
    <path d="M118 291h8m-8 4h8m-8 4h5" stroke="#7543db" stroke-width="1.7" stroke-linecap="round" />
    <text x="144" y="299" fill="#5b38a7" font-size="16" font-weight="700">Global architecture</text>

    <rect x="96" y="324" width="354" height="42" rx="11" fill="#fff5db" />
    <rect x="96" y="324" width="5" height="42" rx="2.5" fill="#e9ad22" />
    <circle cx="122" cy="345" r="9" fill="#e9ad22" opacity="0.22" />
    <path d="M118 344h8m-6-4v8" stroke="#9a6b00" stroke-width="1.7" stroke-linecap="round" />
    <text x="144" y="350" fill="#745100" font-size="16" font-weight="700">Business knowledge</text>

    <rect x="96" y="375" width="354" height="42" rx="11" fill="#ffecea" />
    <rect x="96" y="375" width="5" height="42" rx="2.5" fill="#f16f68" />
    <circle cx="122" cy="396" r="9" fill="#f16f68" opacity="0.2" />
