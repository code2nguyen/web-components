<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Message</title>
    <script type="module" src="/src/chat-message.ts"></script>
    <script type="module">
      import '@c2n/avatar'
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        gap: 28px;
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 24px;
        background: #f4f4f5;
        color: #27272a;
        font-family: Inter, system-ui, sans-serif;
      }
      section {
        display: grid;
        gap: 22px;
        padding: 28px;
        border: 1px solid #e4e4e7;
        border-radius: 24px;
        background: #fff;
      }
      p {
        margin: 0;
      }
      .assistant-avatar {
        --c2-avatar--background: #18181b;
      }
      .outgoing {
        --c2-chat-message__message--max-width: 30rem;
        --c2-chat-message__message--padding-top: 10px;
        --c2-chat-message__message--padding-right: 14px;
        --c2-chat-message__message--padding-bottom: 10px;
        --c2-chat-message__message--padding-left: 14px;
        --c2-chat-message__message--border-top-left-radius: 18px;
        --c2-chat-message__message--border-top-right-radius: 5px;
        --c2-chat-message__message--border-bottom-left-radius: 18px;
        --c2-chat-message__message--border-bottom-right-radius: 18px;
        --c2-chat-message__message--background: #18181b;
        --c2-chat-message__message--color: #fff;
      }
    </style>
  </head>

  <body>
    <section>
      <c2-chat-message>
        <c2-avatar class="assistant-avatar" name="Nova AI" initials="AI" slot="avatar"></c2-avatar>
        <span slot="title">Nova</span>
        <time slot="header-time">Now</time>
        <p>The component now supports natural message content and collapses optional regions when they are empty.</p>
      </c2-chat-message>

      <c2-chat-message class="outgoing" align="right">
        <span slot="title">You</span>
        <time slot="header-time">2:42 PM</time>
        <p>That feels much closer to a real conversation.</p>
        <span slot="footer-time">Delivered</span>
      </c2-chat-message>
    </section>
  </body>
</html>
