    <path d="M666 236a15 15 0 0 1 15-15h402a15 15 0 0 1 15 15v23H666Z" fill="#f8fafc" />
    <circle cx="687" cy="240" r="4" fill="#ef7770" />
    <circle cx="702" cy="240" r="4" fill="#efc94c" />
    <circle cx="717" cy="240" r="4" fill="#62b48f" />
    <rect x="759" y="233" width="236" height="13" rx="6.5" fill="#e9eef6" />

