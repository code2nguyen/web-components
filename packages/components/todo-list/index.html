<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@c2n/todo-list</title>
    <script type="module" src="/src/todo-list.ts"></script>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: system-ui, sans-serif;
        background: #eceef2;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 24px;
        align-items: start;
      }
      .brand {
        --c2-todo-list__accent--color: #7c3aed;
        --c2-todo-list__container--border-radius: 20px;
        --c2-todo-list__container--border: 0;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <c2-todo-list
        heading="Launch week"
        customizable
        storage-key="harness-launch-week"
        persist-tasks
        tasks='[
          {"label": "Draft the launch announcement", "done": true, "due": "Mon"},
          {"label": "Record the demo walkthrough", "done": true},
          {"label": "Review pricing page copy", "done": true},
          {"label": "Ship the v2.0 build", "icon": "rocket", "due": "Today", "urgent": true},
          {"label": "Book the team dinner", "due": "Fri"},
          {"label": "Thank the beta testers"},
          {"label": "Plan the next sprint", "due": "Next week"}
        ]'
      ></c2-todo-list>

      <c2-todo-list
        class="brand"
        heading="Reading list"
        progress="hero"
        tasks='[
          {"label": "Piranesi", "icon": "book", "done": true},
          {"label": "The Overstory", "icon": "tree", "done": true},
          {"label": "Klara and the Sun", "icon": "sun"},
          {"label": "Tomorrow, and Tomorrow", "icon": "game"}
        ]'
      ></c2-todo-list>

      <c2-todo-list
        heading="Groceries"
        progress="bar"
        readonly
        tasks='[
          {"label": "Oat milk", "icon": "cart", "done": true},
          {"label": "Sourdough loaf", "icon": "bake"},
          {"label": "Blueberries", "icon": "apple"},
          {"label": "Coffee beans", "icon": "coffee"}
        ]'
      ></c2-todo-list>

      <c2-todo-list heading="Weekend" customizable>
        <span slot="empty">Nothing planned. Add something fun.</span>
      </c2-todo-list>
    </div>
  </body>
</html>
