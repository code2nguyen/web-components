name: WebKit regex probe (temporary)
on:
  push:
    branches: [claude/webkit-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test packages/components/code-viewer/test/code-viewer.spec.ts packages/components/page-editor/test/page-editor.spec.ts --project=webkit --reporter=list -g "css-variables theme colours|code tokens take their colour" --retries=0 --repeat-each=15 --workers=4
