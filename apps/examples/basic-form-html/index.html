<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Form · c2n example</title>
    <script>
      // The gallery embeds this page in an iframe and passes its own resolved theme through `?theme=`.
      // Applied before first paint so an embedded demo never flashes light inside a dark page.
      // Opened standalone with no parameter, `@c2n/theme`'s prefers-color-scheme fallback takes over.
      ;(function () {
        try {
          var theme = new URLSearchParams(location.search).get('theme')
          if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
        } catch (e) {
          /* the prefers-color-scheme fallback still applies */
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <main class="page">
      <c2-card class="form-card">
        <div slot="header" class="form-card__head">
          <h1>Account settings</h1>
          <p>Update the profile shown to your teammates.</p>
        </div>

        <!-- c2-form validates on submit, summarizes the errors, maps server errors onto fields and tracks unsaved
             changes. Each c2-form-field draws the label, hint and error and names its control for screen readers. -->
        <c2-form id="account" necessity="required">
          <form id="account-form">
            <c2-form-field label="Full name">
              <c2-text-field id="full-name" name="fullName" value="Ada Lovelace" required autocomplete="name"></c2-text-field>
            </c2-form-field>

            <c2-form-field label="Email" hint="We'll send a confirmation link.">
              <c2-text-field id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></c2-text-field>
              <span slot="error" data-match="typeMismatch">Enter an email address like name@example.com.</span>
            </c2-form-field>

            <c2-form-field label="Country" necessity="optional">
              <c2-select id="country" name="country" placeholder="Select a country" value="GB">
                <c2-list-item value="US">United States</c2-list-item>
                <c2-list-item value="GB">United Kingdom</c2-list-item>
                <c2-list-item value="FR">France</c2-list-item>
                <c2-list-item value="DE">Germany</c2-list-item>
                <c2-list-item value="VN">Vietnam</c2-list-item>
              </c2-select>
            </c2-form-field>

            <c2-form-field id="postcode-field" label="Postcode" necessity="optional">
              <c2-mask-input id="postcode" name="postcode" autocomplete="postal-code"></c2-mask-input>
            </c2-form-field>

            <c2-form-field hint="A summary of your team's activity every Monday.">
              <c2-switch id="digest" name="digest" value="on" checked>Weekly digest</c2-switch>
            </c2-form-field>

            <c2-form-field class="consent">
              <c2-checkbox id="terms" name="terms" value="accepted" required>I agree to the terms of service</c2-checkbox>
              <span slot="error">Accept the terms of service to save your settings.</span>
            </c2-form-field>

            <div class="form-card__actions">
              <span class="unsaved" id="unsaved" hidden>Unsaved changes</span>
              <c2-button class="ghost" type="reset">Discard</c2-button>
              <c2-button type="submit">Save changes</c2-button>
            </div>
          </form>
        </c2-form>
      </c2-card>
    </main>
  </body>
</html>
