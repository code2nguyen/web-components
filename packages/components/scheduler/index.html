<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-scheduler</title>
    <script type="module" src="/src/scheduler.ts"></script>
    <style>
      body {
        display: grid;
        gap: 32px;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }
      output {
        color: #71717a;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <h2>Editable day view</h2>
    <c2-scheduler
      id="editable"
      editable
      date="2026-11-09"
      day-start="07:00"
      day-end="20:00"
      resources='[{"id":"ana","label":"Ana Ruiz","group":"Design","description":"Product designer","color":"#7c3aed"},{"id":"kenji","label":"Kenji Ono","group":"Design","description":"UX research","color":"#0891b2"},{"id":"aurora","label":"Aurora","group":"Rooms","description":"8 seats","color":"#16a34a"},{"id":"borealis","label":"Borealis","group":"Rooms","description":"4 seats","color":"#ea580c"}]'
      events='[{"id":"1","resource":"ana","start":"2026-11-09T09:00","end":"2026-11-09T10:30","title":"Kick-off"},{"id":"2","resource":"ana","start":"2026-11-09T11:30","end":"2026-11-09T13:30","title":"Design review"},{"id":"3","resource":"kenji","start":"2026-11-09T09:30","end":"2026-11-09T11:30","title":"Interviews"},{"id":"4","resource":"kenji","start":"2026-11-09T10:00","end":"2026-11-09T11:00","title":"Sync with PM"},{"id":"5","resource":"aurora","start":"2026-11-09T09:00","end":"2026-11-09T10:00","title":"Stand-up"},{"id":"6","resource":"borealis","start":"2026-11-09T13:00","end":"2026-11-09T14:30","title":"1:1","readonly":true}]'
    ></c2-scheduler>
    <output id="log">Drag empty time, a bar or its edges.</output>

    <h2>Week view</h2>
    <c2-scheduler
      view="week"
      date="2026-11-09"
      resource-heading="Machines"
      resources='[{"id":"p1","label":"Press 1"},{"id":"p2","label":"Press 2"}]'
      events='[{"id":"1","resource":"p1","start":"2026-11-09T08:00","end":"2026-11-10T14:00","title":"Order 1182"},{"id":"2","resource":"p2","start":"2026-11-11T07:00","end":"2026-11-13T18:00","title":"Order 1185"}]'
    ></c2-scheduler>

    <script type="module">
      const scheduler = document.getElementById('editable')
      const log = document.getElementById('log')
      let next = 100
      scheduler.addEventListener('event-change', ({ detail }) => {
        scheduler.events = scheduler.events.map((item) =>
          item === detail.event ? { ...item, start: detail.start, end: detail.end, resource: detail.resource } : item,
        )
        log.textContent = `event-change: ${detail.event.title} → ${detail.resource}, ${detail.start} – ${detail.end}`
      })
      scheduler.addEventListener('range-select', ({ detail }) => {
        scheduler.events = [...scheduler.events, { id: String(next++), title: 'New booking', ...detail }]
        log.textContent = `range-select: ${detail.resource}, ${detail.start} – ${detail.end}`
      })
    </script>
  </body>
</html>
