<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-dashboard</title>
    <script type="module" src="/src/dashboard.ts"></script>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #18181b;
        background: #fafafa;
      }

      h2 {
        margin: 32px 0 12px;
        font-size: 14px;
        font-weight: 600;
        color: #71717a;
      }

      h2:first-of-type {
        margin-top: 0;
      }

      c2-dashboard {
        --c2-dashboard--gap: 10px;
        --c2-dashboard--padding: 10px;
        --c2-dashboard--background: #f4f4f5;
        --c2-dashboard--border-radius: 12px;
        height: 340px;
      }

      c2-dash-card {
        --c2-dash-card--background: #ffffff;
        --c2-dash-card--border: 1px solid #e4e4e7;
        --c2-dash-card--border-radius: 8px;
        --c2-dash-card__expanded--background: #ffffff;
        --c2-dash-card__header--border-bottom: 1px solid #e4e4e7;
      }

      .pane {
        display: grid;
        height: 100%;
        place-items: center;
        font-size: 13px;
        color: #71717a;
        background: #fafafa;
      }
    </style>
  </head>

  <body>
    <h2>Three columns, two rows — drag any edge</h2>
    <c2-dashboard columns="320px 1fr 1fr" rows="2" storage-key="c2n-dashboard-demo">
      <c2-dash-card col="1" row="1" row-span="2" min-width="220" expand-full>
        <span slot="header">Watchlist</span>
        <div class="pane">tall left column</div>
      </c2-dash-card>

      <c2-dash-card col="2" row="1" col-span="2" min-height="80" expand-full>
        <span slot="header">Price</span>
        <div class="pane">wide top cell</div>
      </c2-dash-card>

      <c2-dash-card col="2" row="2" expand-width expand-height>
        <span slot="header">Orders</span>
        <div class="pane">bottom left</div>
      </c2-dash-card>

      <c2-dash-card col="3" row="2">
        <span slot="header">Trades</span>
        <div class="pane">bottom right</div>
      </c2-dash-card>
    </c2-dashboard>

    <h2>No header row: the controls float over the pane</h2>
    <c2-dashboard columns="2" rows="1" style="height: 160px">
      <c2-dash-card col="1" row="1" expand-full>
        <div class="pane">left</div>
      </c2-dash-card>
      <c2-dash-card col="2" row="1">
        <div class="pane">right</div>
      </c2-dash-card>
    </c2-dashboard>

    <h2>Fixed panes: resize="none"</h2>
    <c2-dashboard columns="1fr 2fr" rows="1" style="height: 120px">
      <c2-dash-card col="1" row="1" resize="none"><div class="pane">1fr</div></c2-dash-card>
      <c2-dash-card col="2" row="1" resize="none"><div class="pane">2fr</div></c2-dash-card>
    </c2-dashboard>
  </body>
</html>
