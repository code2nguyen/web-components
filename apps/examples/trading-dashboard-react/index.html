<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Dashboard · c2n example</title>
    <script>
      // The docs site embeds this page in an iframe and passes its own resolved theme through `?theme=`.
      ;(function () {
        try {
          var theme = new URLSearchParams(location.search).get('theme')
          if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
        } catch (e) {
          /* the prefers-color-scheme fallback still applies */
        }
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
