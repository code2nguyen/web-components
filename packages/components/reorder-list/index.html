<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reorder list</title>
    <script type="module" src="/src/reorder-list.ts"></script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
        background: Canvas;
        color: CanvasText;
      }
      .scrollable {
        height: 360px;
        overflow-y: auto;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 14px;
      }
      .queue {
        --c2-reorder-list--container-gap: 8px;
        --c2-reorder-list--container-padding: 12px;
        --c2-reorder-list__placeholder--border-color: #2563eb;
        --c2-reorder-list__dragging-item--box-shadow: 0 16px 36px rgb(15 23 42 / 28%);
      }
      .queue::part(item),
      .queue::part(dragging-item) {
        border-radius: 10px;
      }
      .task,
      .feedback {
        box-sizing: border-box;
        min-height: 64px;
        padding: 16px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 10px;
        background: Canvas;
      }
      .task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .task[data-fixed] {
        background: color-mix(in srgb, #f59e0b 14%, Canvas);
      }
      .feedback {
        border-style: dashed;
        color: #2563eb;
      }
      output {
        display: block;
        margin-top: 16px;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <h1>Deployment queue</h1>
    <p>Drag a task, or focus one and use Space followed by Arrow keys, Home, or End. Space commits and Escape cancels.</p>
    <div class="scrollable">
      <c2-reorder-list id="queue" class="queue" editable aria-label="Deployment queue">
        <article class="task" data-reorder-key="verify" data-reorder-label="Verify release"><strong>Verify release</strong><span>Automated</span></article>
        <article class="task" data-fixed data-reorder-key="approval" data-reorder-label="Required approval">
          <strong>Required approval</strong><span>Pinned</span>
        </article>
        <article class="task" data-reorder-key="notes" data-reorder-label="Write release notes">
          <strong>Write release notes</strong><button type="button">Open notes</button>
        </article>
        <article class="task" data-reorder-key="publish" data-reorder-label="Publish package"><strong>Publish package</strong><span>Ready</span></article>
        <article class="task" data-reorder-key="announce" data-reorder-label="Announce release"><strong>Announce release</strong><span>Waiting</span></article>
        <div slot="placeholder" class="feedback">Drop task here</div>
        <div slot="dragging-item" class="feedback">Moving task</div>
      </c2-reorder-list>
    </div>
    <output id="result" aria-live="polite">No committed reorder yet.</output>
    <script type="module">
      const queue = document.querySelector('#queue')
      const result = document.querySelector('#result')
      queue.addEventListener('reorder', (event) => {
        const keys = event.detail.order.map((item) => item.key)
        result.value = `Persist: ${keys.join(' → ')} (${event.detail.inputMethod})`
        for (const item of event.detail.order) queue.append(item.element)
      })
    </script>
  </body>
</html>
