<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c2-notepad</title>
    <script type="module" src="/src/notepad.ts"></script>
    <style>
      body {
        margin: 0;
        padding: 40px 24px;
        background: #e7e9ec;
        font:
          14px system-ui,
          sans-serif;
        color: #18181b;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 48px 32px;
        max-width: 1100px;
        margin: 0 auto;
      }
      h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      .legal {
        --c2-notepad__sheet--background: #fbf1a6;
        --c2-notepad__rule--color: #8fb2d6;
        --c2-notepad__margin--color: #e07a6e;
        --c2-notepad__writing--color: #1b2433;
        --c2-notepad__spiral--display: none;
        --c2-notepad__glue--display: block;
      }
      .dots {
        --c2-notepad__rule--color: transparent;
        --c2-notepad__dot--color: #b5b0a3;
        --c2-notepad__margin--color: transparent;
        --c2-notepad__margin--inset: 8px;
      }
      .night {
        --c2-notepad__sheet--background: #232a33;
        --c2-notepad__rule--color: #3b4654;
        --c2-notepad__margin--color: #6a4651;
        --c2-notepad__writing--color: #e9e4d4;
        --c2-notepad__ink-red--color: #ff8f8f;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>Default: select text for the toolbar</h2>
        <c2-notepad
          label="Meeting notes"
          placeholder="Write something…"
          value='Thursday sync
Ship the notepad **behind a flag**
Ask about the <span data-ink="red">night paper</span>
- [ ] lines sit *under* the text'
          ><span slot="header">Notes · Oct 1</span></c2-notepad
        >
      </section>
      <section>
        <h2>Tearable</h2>
        <c2-notepad id="tear" label="To call" tearable value="Plumber: Thu after 4&#10;Landlord about the heating"></c2-notepad>
        <p id="torn"></p>
      </section>
      <section>
        <h2>Legal pad</h2>
        <c2-notepad class="legal" label="Legal pad" value="1. Timeline of the March emails&#10;2. Who signed the ~~first~~ second draft?"></c2-notepad>
      </section>
      <section>
        <h2>Dot grid, bold and italic only</h2>
        <c2-notepad class="dots" label="Journal" marks="bold italic" value="October goals&#10;- [x] read two books&#10;- [ ] run 3× a week"></c2-notepad>
      </section>
      <section>
        <h2>Night paper</h2>
        <c2-notepad class="night" label="Night shift" value='02:10 deploy rolled back&#10;cause: <span data-ink="red">migration lock</span>'></c2-notepad>
      </section>
      <section>
        <h2>States</h2>
        <c2-notepad label="Read-only" readonly value="Signed copy, read-only"></c2-notepad>
        <br />
        <c2-notepad label="Required" required error error-text="Write a summary first"></c2-notepad>
      </section>
    </main>
    <script type="module">
      const tear = document.getElementById('tear')
      tear.addEventListener('page-tear', (event) => {
        document.getElementById('torn').textContent = `Torn page ${event.detail.page}: ${event.detail.value}`
      })
    </script>
  </body>
</html>
